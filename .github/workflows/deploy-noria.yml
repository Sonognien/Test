name: Deploy Noria to GitHub Pages

on:
  push:
    branches: [noria-budget-deploy]
    paths:
      - "Noria Budgets/**"
      - ".github/workflows/deploy-noria.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Noria frontend
        run: |
          test -f "Noria Budgets/index.html"
          test -f "Noria Budgets/app.js"
          test -f "Noria Budgets/cloud-sync.js"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "Noria Budgets"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
